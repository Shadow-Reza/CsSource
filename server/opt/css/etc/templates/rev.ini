; RevEmu (bir3yk) server config for the Chogan CS:S v92 base — installed at /opt/css/base/rev.ini (srcds cwd).
; Reference: https://bir3yk.net/forum/topic_3229/ ; key meanings in docs/revemu.md §2b. Keys not listed keep defaults.
; Policy: identity is the Chogan phone account, never the SteamID (MISSION §3), so the permissive profile is fine.
[steamclient]
PlayerName = SteamPlayer
Logging = True
ClientDLL=./bin/steamclient_valve.so
DisableUnlockedItems = True
EnableSDK = False

[GameServer]
AllowOldRev74 = False
AllowOldRev = False
AllowUnknown = True
AllowCracked = True
AllowLegit = True
AllowedAnyCountConnectUnknownClientWithOneIP = True
Fake_player = False
RevEmu_2012 = False
RejectText = Use the Chogan launcher
AddCountPlayerInServerName = False
; no online ticket check against bir3yk's backend: no external dependency, no join latency (see OQ-6)
Check_Ticket = False
Check_Ticket_Async = True
Allow_Fail_Check = True
UseConectSM = False
