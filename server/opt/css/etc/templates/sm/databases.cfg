// rendered by css-genconf — SourceMod DB config (MariaDB on loopback). Secrets from /opt/css/etc/secrets/db.env
"Databases"
{
	"driver_default"		"mysql"
	"default"
	{
		"driver"			"mysql"
		"host"				"127.0.0.1"
		"database"			"@@DB_NAME_SM@@"
		"user"				"@@DB_SM_USER@@"
		"pass"				"@@DB_SM_PASS@@"
		"port"				"3306"
	}
	"clientprefs"
	{
		"driver"			"mysql"
		"host"				"127.0.0.1"
		"database"			"@@DB_NAME_SM@@"
		"user"				"@@DB_SM_USER@@"
		"pass"				"@@DB_SM_PASS@@"
		"port"				"3306"
	}
	"chogan"
	{
		"driver"			"mysql"
		"host"				"127.0.0.1"
		"database"			"@@DB_NAME_AGENT@@"
		"user"				"@@DB_SM_USER@@"
		"pass"				"@@DB_SM_PASS@@"
		"port"				"3306"
	}
	"storage-local"
	{
		"driver"			"sqlite"
		"database"			"sourcemod-local"
	}
}
