// Chogan CS:S — common server.cfg (rendered by css-genconf; do not edit on the box, edit the repo template)
// instance: @@INSTANCE@@  mode: @@MODE@@
hostname "@@HOSTNAME@@"
sv_contact "@@CONTACT@@"
sv_tags "chogan,@@MODE@@"
sv_region 255
sv_lan 0
sv_cheats 0
sv_pausable 0
sv_password ""

// downloads: FastDL on the same IP; throttled by nginx (MISSION §6.2)
sv_allowupload 0
sv_allowdownload 1
sv_downloadurl "http://212.80.8.87/cstrike"
sv_consistency 1
sv_pure 0

// rates (MISSION §6.2) — 100-tick instances override the *rate ceilings in instance.cfg
sv_minrate 80000
sv_maxrate 0
sv_minupdaterate 33
sv_maxupdaterate @@MAXUPDATERATE@@
sv_mincmdrate 33
sv_maxcmdrate @@MAXCMDRATE@@
sv_client_min_interp_ratio 1
sv_client_max_interp_ratio 2
sv_client_predict 1
sv_client_cmdrate_difference 20
fps_max 300
sv_timeout 65
sv_unlag 1
sv_maxunlag 0.5

// voice / chat
sv_voiceenable 1
sv_alltalk 0
mp_chattime 8

// logging
log on
sv_logfile 1
sv_logbans 1
sv_logecho 0
sv_log_onefile 0
sv_logflush 0
sv_logsdir "logs"

// rcon (password lives in server_secrets.cfg, and RCON is firewalled to loopback+operator anyway)
sv_rcon_banpenalty 5
sv_rcon_maxfailures 5
sv_rcon_minfailures 3
sv_rcon_minfailuretime 30

// SourceTV off by default (match modes turn it on in their mode cfg)
tv_enable 0
tv_maxclients 0

// misc
sv_visiblemaxplayers -1
mp_autokick 0
sv_hibernate_when_empty 1
sv_hibernate_ms 20
mp_flashlight 1
sv_specnoclip 1
sv_specspeed 3
sv_forcepreload 1
mp_playerid 0
mp_forcecamera 1
mp_fadetoblack 0
mp_tkpunish 0
mp_hostagepenalty 5
mp_spawnprotectiontime 0
decalfrequency 60
sv_gravity 800
sv_airaccelerate 10
sv_enablebunnyhopping 0
sv_enableoldqueries 0

// non-Steam identity is forgeable: nothing here keys on SteamID (MISSION §3)
sv_lan 0

exec instance.cfg
exec mode_@@MODE@@.cfg
exec server_secrets.cfg
