#!/usr/sbin/nft -f
# Chogan CS:S host firewall (MISSION §6.7). One IP carries: SSH, 7 game ports (UDP game + TCP RCON on the same
# numbers), FastDL :80, SourceTV ports, Steam GS ports. Policy: default drop inbound.
#  - SSH: open (owner logs in by password from changing IPs — MISSION rule 3), per-source rate limited.
#  - Game UDP 27015-27019,27025,27026: open, per-source rate limited; A2S query opcodes (T/U/V/W/i) dropped
#    unless from @monitoring_v4 or loopback (players come via the launcher, not the server browser).
#  - RCON (TCP on the game ports): only loopback and @operator_v4.
#  - SourceTV 27030-27036 and Steam GS 26900-26906: no inbound (outbound-initiated only).
#  - FastDL TCP 80: open (nginx limit_rate does the throttling).
flush ruleset

table inet filter {
    set operator_v4 {
        type ipv4_addr; flags interval
        comment "operator/admin IPs: RCON + unrestricted A2S. Edit with: nft add element inet filter operator_v4 { a.b.c.d }"
        elements = { 5.160.4.2 }
    }
    set monitoring_v4 {
        type ipv4_addr; flags interval
        comment "external monitoring IPs allowed to A2S-query"
        elements = { 5.160.4.2 }
    }
    set game_udp {
        type inet_service; flags interval
        elements = { 27015-27019, 27025, 27026 }
    }
    set blocklist_v4 {
        type ipv4_addr; flags interval, timeout
        comment "manual/automatic bans: nft add element inet filter blocklist_v4 { a.b.c.d timeout 1h }"
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid counter drop
        ip saddr @blocklist_v4 counter drop

        # ICMP: echo + errors, rate limited
        ip protocol icmp icmp type { echo-request } limit rate 20/second accept
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        ip6 nexthdr icmpv6 icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept

        # SSH — open, but per-source new-connection rate limit
        tcp dport 22 ct state new meter ssh_src { ip saddr limit rate 30/minute burst 30 packets } counter accept
        tcp dport 22 ct state new counter drop comment "ssh rate exceeded"

        # FastDL
        tcp dport 80 ct state new counter accept

        # RCON = TCP on the game port numbers: operator only (loopback already accepted above)
        tcp dport @game_udp ip saddr @operator_v4 ct state new counter accept
        tcp dport @game_udp counter drop comment "rcon from non-operator"

        # Game UDP: A2S query opcodes (payload FF FF FF FF + T/U/V/W/i) only from monitoring/operator IPs
        udp dport @game_udp @th,64,32 0xffffffff @th,96,8 { 0x54, 0x55, 0x56, 0x57, 0x69 } ip saddr @monitoring_v4 counter accept
        udp dport @game_udp @th,64,32 0xffffffff @th,96,8 { 0x54, 0x55, 0x56, 0x57, 0x69 } ip saddr @operator_v4 counter accept
        udp dport @game_udp @th,64,32 0xffffffff @th,96,8 { 0x54, 0x55, 0x56, 0x57, 0x69 } counter drop comment "a2s from public"
        # connectionless packets (challenge/connect etc.) per-source limit — stops connect/challenge floods
        udp dport @game_udp @th,64,32 0xffffffff meter cl_src { ip saddr limit rate over 30/second burst 60 packets } counter drop comment "connectionless flood"
        # per-source game packet limit (a NAT with several players still fits; a flood does not)
        udp dport @game_udp meter game_src { ip saddr limit rate over 1500/second burst 3000 packets } counter drop comment "udp flood"
        udp dport @game_udp counter accept

        # everything else: log a sample, drop
        limit rate 5/minute log prefix "nft-drop: " level info
        counter drop
    }
    chain forward { type filter hook forward priority filter; policy drop; }
    chain output  { type filter hook output priority filter; policy accept; }
}
